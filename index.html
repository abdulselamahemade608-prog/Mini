<style>
:root{
  --bg:#05090f;
  --surface:#101a2c;
  --surface2:#152238;
  --raised:#1c2d47;
  --line:rgba(148,180,222,.16);

  --text:#f5f8fc;
  --muted:#8ea0bc;

  --gold:#16c777;
  --gold2:#4bffa0;
  --gold-ink:#04150b;

  --blue:#4f9cff;
  --blue2:#7bb8ff;

  --ok:#35d49a;
  --bad:#ff6d61;
  --warning:#f5bd55;

  --radius:22px;
  --glass:rgba(255,255,255,.045);

  font-family:
    "Inter",
    "Noto Sans Ethiopic",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    Roboto,
    sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  background:
    radial-gradient(circle at 15% -8%,rgba(75,255,160,.14) 0%,transparent 40%),
    radial-gradient(circle at 85% 0%,rgba(22,199,119,.12) 0%,transparent 42%),
    radial-gradient(circle at 50% 105%,rgba(75,255,160,.06) 0%,transparent 45%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100%;
  letter-spacing:-.1px;
}

body{
  padding:14px 14px calc(104px + env(safe-area-inset-bottom));
  max-width:480px;
  margin:0 auto;
  font-size:15px;
  line-height:1.45;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  cursor:pointer;
}

button:disabled{
  cursor:default;
}

.ic{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
}

.ic.sm{
  width:17px;
  height:17px;
}

h2{
  font-size:17px;
  font-weight:700;
  margin:20px 2px 10px;
}

p.muted,
.muted{
  color:var(--muted);
  font-size:13px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.between{
  justify-content:space-between;
}

.grow{
  flex:1;
  min-width:0;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid2 .card{
  margin:0;
}

/* ---------------- CARDS ---------------- */

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,0) 60%
    ),
    var(--glass),
    var(--surface);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;

  box-shadow:
    0 14px 34px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.05);

  animation:cardIn .35s cubic-bezier(.2,.8,.2,1) both;
}

.hero{
  padding:22px 18px 19px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 88% -10%,
      rgba(75,255,160,.22),
      transparent 42%
    ),
    radial-gradient(
      circle at 0% 110%,
      rgba(22,199,119,.14),
      transparent 45%
    ),
    linear-gradient(
      150deg,
      #16301f 0%,
      #0e1a13 60%,
      #0a120d 100%
    );

  border-color:rgba(75,255,160,.28);
}

.hero .amt{
  font-size:46px;
  font-weight:800;
  letter-spacing:-1.5px;
  font-variant-numeric:tabular-nums;
  line-height:1.05;
  margin-top:7px;
}

.hero .amt small{
  font-size:16px;
  color:var(--gold2);
  font-weight:700;
  letter-spacing:0;
  margin-left:6px;
}

.hero .etb{
  color:var(--muted);
  margin-top:5px;
}

/* ---------------- FLAME / LEVEL ---------------- */

.flame{
  width:44px;
  height:44px;
  border-radius:14px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      145deg,
      var(--gold2),
      var(--gold)
    );

  color:var(--gold-ink);

  box-shadow:
    0 8px 20px rgba(245,189,85,.15);
}

.flame .ic{
  width:24px;
  height:24px;
}

.badge{
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:99px;

  background:var(--raised);
  border:1px solid var(--line);
}

.badge.b1{
  color:#e6a66a;
}

.badge.b2{
  color:#dce5f2;
}

.badge.b3{
  color:var(--gold2);
}

/* ---------------- PROGRESS ---------------- */

.bar{
  height:8px;
  border-radius:99px;
  background:#0a1525;
  overflow:hidden;
  margin:12px 0 6px;
}

.bar i{
  display:block;
  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      var(--gold2)
    );

  border-radius:99px;
  transition:width .5s ease;
}

/* ---------------- BUTTONS ---------------- */

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  width:100%;
  padding:14px 16px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  color:var(--gold-ink);

  font-weight:750;

  box-shadow:
    0 10px 24px rgba(245,189,85,.22),
    inset 0 1px 0 rgba(255,255,255,.35);

  transition:
    transform .15s ease,
    opacity .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
}

.btn:hover{
  filter:brightness(1.06);
  box-shadow:
    0 12px 28px rgba(245,189,85,.3),
    inset 0 1px 0 rgba(255,255,255,.35);
}

.btn:active:not([disabled]){
  transform:scale(.97);
}

.btn.ghost{
  background:var(--raised);
  color:var(--text);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

.btn.sm{
  width:auto;
  padding:9px 14px;
  border-radius:12px;
  font-size:13px;
}

.btn[disabled]{
  opacity:.4;
  box-shadow:none;
  filter:grayscale(.3);
}

/* ---------------- INPUTS ---------------- */

input,
select,
textarea{
  width:100%;
  padding:12px 13px;

  border-radius:13px;

  background:#091524;
  color:var(--text);

  border:1px solid var(--line);

  margin-top:6px;

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(245,189,85,.08);
}

label{
  display:block;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}

/* ---------------- LIST ---------------- */

.item{
  display:flex;
  align-items:center;
  gap:12px;

  padding:13px 0;

  border-top:1px solid var(--line);
}

.item:first-child{
  border-top:0;
  padding-top:0;
}

.item:last-child{
  padding-bottom:0;
}

.item .t{
  font-weight:650;
}

.pill{
  font-size:12px;
  font-weight:700;

  padding:4px 9px;

  border-radius:99px;

  background:rgba(245,189,85,.12);
  color:var(--gold2);
}

.pill.ok{
  background:rgba(53,212,154,.12);
  color:var(--ok);
}

.pill.bad{
  background:rgba(255,109,97,.12);
  color:var(--bad);
}

/* ---------------- NAVIGATION ---------------- */

nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  display:flex;
  justify-content:center;

  padding:
    0
    14px
    calc(14px + env(safe-area-inset-bottom));

  z-index:20;

  pointer-events:none;
}

nav div{
  display:flex;
  width:100%;
  max-width:480px;
  pointer-events:auto;

  background:rgba(14,22,38,.82);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid var(--line);
  border-radius:20px;

  padding:6px;

  box-shadow:
    0 16px 34px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.06);
}

nav button{
  flex:1;

  background:none;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:4px;

  color:var(--muted);

  font-size:11px;

  padding:8px 0;

  border-radius:14px;

  transition:
    color .2s ease,
    background .2s ease,
    transform .15s ease;
}

nav button.on{
  color:var(--gold-ink);
  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );
  box-shadow:0 6px 16px rgba(245,189,85,.28);
}

nav button:active{
  transform:scale(.94);
}

.navemoji{
  font-size:20px;
  line-height:1;
}

/* ---------------- SPIN ---------------- */

.wheelbox{
  position:relative;
  width:min(78vw,300px);
  margin:8px auto 18px;
}

.pointer{
  position:absolute;

  left:50%;
  top:-8px;

  transform:translateX(-50%);

  width:0;
  height:0;

  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:20px solid var(--gold);

  z-index:2;

  filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));
}

#wheel{
  transition:transform 4s cubic-bezier(.12,.7,.1,1);
}

#wheel svg{
  width:100%;
  display:block;

  filter:
    drop-shadow(0 8px 22px rgba(0,0,0,.35));
}

.ticker{
  overflow:hidden;
  white-space:nowrap;

  background:var(--surface);

  border:1px solid var(--line);
  border-radius:13px;

  padding:8px 0;
  margin-bottom:6px;
}

.ticker span{
  display:inline-block;

  padding-left:100%;

  animation:
    tick 26s linear infinite;

  color:var(--muted);
  font-size:13px;
}

@keyframes tick{
  to{
    transform:translateX(-100%);
  }
}

@media(prefers-reduced-motion:reduce){
  .ticker span{
    animation:none;
    padding-left:12px;
  }

  #wheel{
    transition-duration:.01s;
  }
}

/* ---------------- OVERLAYS ---------------- */

#gate,
#fatal{
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(75,255,160,.12) 0%,
      transparent 42%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(22,199,119,.1) 0%,
      transparent 45%
    ),
    var(--bg);

  z-index:50;

  padding:
    calc(28px + env(safe-area-inset-top))
    18px
    24px;

  overflow:auto;

  display:none;
}

#gate .in,
#fatal .in{
  max-width:480px;
  margin:0 auto;
}

#gate h1,
#fatal h1{
  font-size:27px;
  line-height:1.15;
  letter-spacing:-.6px;
}

/* ---------------- LOADING ---------------- */

.loading-wrap{
  min-height:70vh;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;
}

.boot-logo{
  width:96px;
  height:96px;

  display:grid;
  place-items:center;

  border-radius:26px;

  background:
    linear-gradient(
      150deg,
      #4bffa0,
      #16c777
    );

  font-size:44px;
  font-weight:800;
  color:#05130b;

  box-shadow:
    0 0 0 1px rgba(76,255,160,.25),
    0 0 60px 14px rgba(46,224,132,.35);

  margin-bottom:18px;

  animation:
    bootPulse 2.2s ease-in-out infinite;
}

@keyframes bootPulse{
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(76,255,160,.25),
      0 0 60px 14px rgba(46,224,132,.35);
  }
  50%{
    box-shadow:
      0 0 0 1px rgba(76,255,160,.35),
      0 0 78px 22px rgba(46,224,132,.5);
  }
}

.spinner{
  width:34px;
  height:34px;

  border:3px solid rgba(46,224,132,.18);
  border-top-color:#2ee084;

  border-radius:50%;

  animation:
    sp .75s linear infinite;

  margin:25px auto;
}

.loading-title{
  font-weight:800;
  font-size:19px;
  margin-top:8px;
}

.loading-text{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

@keyframes sp{
  to{
    transform:rotate(360deg);
  }
}

.channel-loading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  color:var(--muted);

  font-size:13px;

  padding:12px 0;
}

.mini-spinner{
  width:17px;
  height:17px;

  border:2px solid var(--line);
  border-top-color:#2ee084;

  border-radius:50%;

  animation:sp .7s linear infinite;
}

/* ---------------- GATE ---------------- */

.gate-top{
  margin-bottom:20px;
}

.gate-icon{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      var(--gold2),
      var(--gold)
    );

  color:var(--gold-ink);

  margin-bottom:18px;

  box-shadow:
    0 10px 25px rgba(245,189,85,.15);
}

.gate-icon .ic{
  width:27px;
  height:27px;
}

.channel-card{
  background:var(--surface);

  border:1px solid var(--line);
  border-radius:18px;

  padding:4px 15px;

  margin-bottom:13px;
}

.channel-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ---------------- TOAST ---------------- */

#toast{
  position:fixed;

  left:50%;

  bottom:
    calc(92px + env(safe-area-inset-bottom));

  transform:
    translateX(-50%)
    translateY(20px);

  background:#172a45;

  border:1px solid var(--line);

  padding:11px 18px;

  border-radius:14px;

  opacity:0;
  pointer-events:none;

  transition:.25s;

  z-index:60;

  max-width:88vw;

  text-align:center;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

#toast.show{
  opacity:1;
  transform:translateX(-50%);
}

/* ---------------- ODDS ---------------- */

.odds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.odds div{
  background:#091524;
  border-radius:11px;
  padding:8px;
  text-align:center;
  font-size:13px;
}

.odds b{
  display:block;
  color:var(--gold2);
}

/* ---------------- SMALL ---------------- */

.empty{
  text-align:center;
  padding:15px 5px;
  color:var(--muted);
}

.success-text{
  color:var(--ok);
}

.warning-text{
  color:var(--warning);
}

.error-text{
  color:var(--bad);
}

@media(max-width:360px){
  body{
    padding-left:10px;
    padding-right:10px;
  }

  .hero .amt{
    font-size:40px;
  }

  .btn.sm{
    padding:7px 9px;
    font-size:12px;
  }
}
</style>
</head>

<!-- ================= APP ================= -->

<div id="app">

    (

        ? ERR.timeout
        : e && e.message
    ) ||

/* =========================================================
   API
========================================================= */

async function api(path,body){

  const c = new AbortController();

  const to = setTimeout(
    () => c.abort(),
    20000
  );

  try{

    const r = await fetch(
      API + path,
      {
        method: body ? 'POST' : 'GET',

        signal:c.signal,

        headers:{
          'Content-Type':'application/json',

          'x-init-data':
            (tg && tg.initData) || '',

          'x-device':
            deviceId()
        },

        body:
          body
            ? JSON.stringify(body)
            : undefined
      }
    );

    const j =
      await r.json().catch(
        () => ({})
      );

    if(
      r.status === 403 &&
      j.error === 'gate'
    ){

      openGate();

      throw Object.assign(
        new Error('gate'),
        {code:'gate'}
      );

    }

    if(!r.ok){

      throw Object.assign(
        new Error(j.error || 'server'),
        {
          code:j.error,
          data:j
        }
      );

    }

    return j;

  }catch(e){

    if(e.name === 'AbortError'){

      throw Object.assign(
        new Error('timeout'),
        {code:'timeout'}
      );

    }

    throw e;

  }finally{

    clearTimeout(to);

  }

}

/* =========================================================

========================================================= */

function joinCh(i){

  if(
    !GATE ||
    !GATE.channels ||
    !GATE.channels[i]
  ) return;

  const c =
    GATE.channels[i];

  const url =
    c.url ||
    channelUrl(c.chat);

  if(
    tg &&
    tg.openTelegramLink
  ){

    tg.openTelegramLink(url);

  }else{

    window.open(
      url,
      '_blank'
    );

  }

  /*
    Check shortly after opening.
  */

  setTimeout(
    () => recheckGate(),
    1800
  );

}

/* =========================================================
   AUTO GATE CHECK
========================================================= */

function startGateAutoCheck(){

  stopGateAutoCheck();

  /*
    Check every 3 seconds while
    user is on the gate screen.
  */

  gateTimer =
    setInterval(
      async ()=>{

        if(
          !gateOpen ||
          gateChecking
        ) return;

        await silentGateCheck();

      },
      3000
    );

}

function stopGateAutoCheck(){

  if(gateTimer){

    clearInterval(gateTimer);

    gateTimer = null;

  }

}

async function silentGateCheck(){

  if(gateChecking) return;

  gateChecking = true;

  try{

    const g =
      await loadGate(true);

    GATE = g;

    renderGate();

    if(g.ok){

      haptic();

      stopGateAutoCheck();

    }

  }catch(e){

    /*
      Do not replace the whole screen
      for temporary network errors.
    */

  }finally{

    gateChecking = false;

  }

}

/* =========================================================
   MANUAL GATE CHECK
========================================================= */

async function recheckGate(){

  if(gateChecking) return;

  gateChecking = true;

  renderGateLoading();

  try{

    GATE =
      await loadGate(true);

    renderGate();

    if(GATE.ok){

      haptic();

    }

  }catch(e){

    toast(errMsg(e));

    renderGateError();

  }finally{

    gateChecking = false;

  }

}

async function enterApp(){

  if(!GATE || !GATE.ok){

    if(!GATE || !GATE.ok){

    }

  }

  stopGateAutoCheck();

  $('#gate').style.display = 'none';

  gateOpen = false;

}

   WATCH AD
========================================================= */

async function watchAd(btn){

  if(busy) return;

  busy = true;

  btn.disabled = true;

  try{

    const s =
      await api(
        '/api/ad/start',
        {}
      );

    /*
      Waterfall: try a fresh AdsGram
      rewarded ad first, fall back to
      Monetag if AdsGram isn't available
      or has nothing to show. The coin
      reward is only ever granted by the
      backend after /api/ad/complete
      verifies this nonce, so neither
      SDK can be spoofed into paying out.
    */

    let shown = false;

    if(adsgram){

      try{

        await adsgram.show();

        shown = true;

      }catch(e){

        shown = false;

      }

    }

    if(
      !shown &&
      typeof show_11849985 ===
      'function'
    ){

      try{

        await show_11849985();

        shown = true;

      }catch(e){

        shown = false;

      }

    }

    if(!shown){

      throw Object.assign(
        new Error('ads_unavailable'),
        {
          code:'ads_unavailable'
        }
      );

    }

    const r =
      await api(
        '/api/ad/complete',
        {
          nonce:s.nonce
        }
      );

    haptic();

    toast(
      `+${r.reward} coins`
    );

    await loadMe();

    render();

  }catch(e){

    if(
      e.code !== 'gate'
    ){

      toast(
        errMsg(e)
      );

    }

    btn.disabled = false;

  }

  busy = false;

}

function segs(kind){

  const s =
    ME.cfg.spin;

  const list =
    kind === 'free'

      ? s.free_prizes

      : [
          ...new Set(
            s.paid_odds.map(
              (r)=>r[0]
            )
          )
        ].sort(
          (a,b)=>a-b
        );

  const out = [];

  for(
    let i=0;
    i<8;
    i++
  ){

    out.push(
      list[i % list.length]
    );

  }

  return out;

}

function buildWheel(kind){

  wheelKind =
    kind;

  const arr =
    segs(kind);

  const R = 96;

  const cols = [
    '#18304e',
    '#254a78',
    '#3a2a12',
    '#5a4216'
  ];

  const pt =
    (a)=>[
      100 + R * Math.sin(a),
      100 - R * Math.cos(a)
    ];

  let svg =
    `
      <svg viewBox="0 0 200 200">

        <circle
          cx="100"
          cy="100"
          r="99"
          fill="#08111f"
          stroke="#16c777"
          stroke-width="2"
        />
    `;

  arr.forEach(
    (p,i)=>{

      const a1 =
        (i * 45) *
        Math.PI /
        180;

      const a2 =
        ((i + 1) * 45) *
        Math.PI /
        180;

      const [
        x1,
        y1
      ] = pt(a1);

      const [
        x2,
        y2
      ] = pt(a2);

      svg += `

        <path
          d="
            M100,100
            L${x1},${y1}
            A${R},${R}
            0 0 1
            ${x2},${y2}
            Z
          "
          fill="${
            p === 0
              ? cols[0]
              : (
                i % 2
                  ? cols[1]
                  : cols[3]
              )
          }"
          stroke="#08111f"
          stroke-width="1"
        />

        <text
          x="100"
          y="34"
          transform="
            rotate(
              ${i * 45 + 22.5}
              100
              100
            )
          "
          text-anchor="middle"
          font-size="14"
          font-weight="700"
          fill="${
            p === 0
              ? '#8fa3bf'
              : '#4bffa0'
          }"
        >
          ${p}
        </text>

      `;

    }
  );

  svg += `
      <circle
        cx="100"
        cy="100"
        r="10"
        fill="#16c777"
      />

      </svg>
  `;

  const w =
    $('#wheel');

  if(!w) return;

  w.style.transition =
    'none';

  w.style.transform =
    'rotate(0deg)';

  rot = 0;

  w.innerHTML =
    svg;

}

async function doSpin(kind){

  if(busy) return;

  busy = true;

  $('#fbtn').disabled =
    true;

  $('#pbtn').disabled =
    true;

  try{

    const r =
      await api(
        '/api/spin',
        {kind}
      );

    buildWheel(kind);

    const arr =
      segs(kind);

    const idxs =
      arr
        .map(
          (p,i)=>
            p === r.prize
              ? i
              : -1
        )
        .filter(
          (i)=>i >= 0
        );

    const idx =
      idxs.length
        ? idxs[
            Math.floor(
              Math.random() *
              idxs.length
            )
          ]
        : 0;

    const w =
      $('#wheel');

    void w.offsetWidth;

    const target =
      360 * 5 +
      (
        (
          360 -
          (
            idx * 45 +
            22.5
          )
        ) % 360
      );

    w.style.transition =
      '';

    w.style.transform =
      `rotate(${target}deg)`;

    await sleep(4200);

    ME.user.coins =
      r.coins;

    ME.cfg.spin.free_left =
      r.free_left;

    if(r.prize > 0){

      haptic();

      toast(
        `You won ${r.prize} coins`
      );

    }else{

      toast(
        'No prize this time'
      );

    }

    const t =
      $('#fbtn');

    const p =
      $('#pbtn');

    t.disabled =
      !r.free_left;

    t.innerHTML =
      `${ic('spin')}
       Free spin (${r.free_left} left)`;

    p.disabled =
      r.coins <
      ME.cfg.spin.cost;

  }catch(e){

    if(
      e.code !== 'gate'
    ){

      toast(
        errMsg(e)
      );

    }

    const t =
      $('#fbtn');

    if(t){

      t.disabled =
        !ME.cfg.spin.free_left;

      $('#pbtn').disabled =
        ME.user.coins <
        ME.cfg.spin.cost;

    }

  }

  busy = false;

}

    }else{

      toast(
        ME.ref_link
      );

    }

  }

}

async function redeem(){

  const code =
    $('#promo').value.trim();

  if(
    !code ||
    busy
  ) return;

  busy = true;

  try{

    const r =
      await api(
        '/api/promo',
        {code}
      );

    haptic();

    toast(
      `+${r.reward} coins`
    );

    await loadMe();

    render();

  }catch(e){

    if(
      e.code !== 'gate'
    ){

      toast(
        errMsg(e)
      );

    }

  }

  busy = false;

}

/* =========================================================
   WALLET
========================================================= */

function vWallet(){

  const w =
    ME.cfg.withdraw;

  const u =
    ME.user;

  const wait =
    w.next_at
      ? new Date(w.next_at)
      : null;

  const blocked =
    !w.open
      ? 'Withdrawals are closed right now.'

      : u.flagged
        ? 'Your account is under review.'

        : wait
          ? `Next withdrawal: ${wait.toLocaleString()}`

          : w.refs_have <
            w.refs_required
            ? `You need ${
                w.refs_required -
                w.refs_have
              } more qualified referrals.`

            : '';

  return `

    <div class="card hero">

      <div class="muted">
        Available
      </div>

      <div class="amt">
        ${etb(u.coins)}
        <small>ETB</small>
      </div>

      <div class="etb">
        ${fmt(u.coins)} coins
      </div>

    </div>

    <div class="card">

      <div
        style="
          font-weight:700;
          font-size:17px
        "
      >
        Withdraw
      </div>

      <p
        class="muted"
        style="margin:6px 0 4px"
      >
        Minimum ${w.min_etb} ETB.
        One withdrawal every
        ${Math.round(w.interval_h / 24)}
        days.
      </p>

      ${
        blocked
          ? `
            <p
              class="warning-text"
              style="margin:10px 0"
            >
              ${esc(blocked)}
            </p>
          `
          : ''
      }

      <label>
        Amount (ETB)

        <input
          id="wamt"
          type="number"
          inputmode="decimal"
          min="${w.min_etb}"
          step="0.01"
          placeholder="${w.min_etb}"
        >
      </label>

      <label>
        Method

        <select id="wmeth">

          <option>
            Telebirr
          </option>

          <option>
            CBE Birr
          </option>

          <option>
            Commercial Bank of Ethiopia
          </option>

        </select>
      </label>

      <label>
        Phone or account number

        <input
          id="wacc"
          inputmode="numeric"
          placeholder="09..."
        >
      </label>

      <button
        class="btn"
        style="margin-top:16px"
        onclick="withdraw()"
        ${
          blocked
            ? 'disabled'
            : ''
        }
      >

        ${ic('send')}

        Request withdrawal

      </button>

    </div>

    <h2>
      History
    </h2>

    <div class="card">

      ${
        WDS.length

          ? WDS.map(
              (x)=>
                `

                  <div class="item">

                    <div class="grow">

                      <div class="t">
                        ${x.etb} ETB
                      </div>

                      <div class="muted">
                        ${esc(x.method)}
                        ·
                        ${
                          new Date(
                            x.created_at
                          ).toLocaleDateString()
                        }
                      </div>

                    </div>

                    <span
                      class="pill ${
                        x.status === 'paid'
                          ? 'ok'
                          : x.status === 'rejected'
                            ? 'bad'
                            : ''
                      }"
                    >
                      ${
                        x.status === 'paid'
                          ? 'Paid'
                          : x.status === 'rejected'
                            ? 'Rejected'
                            : 'Pending'
                      }
                    </span>

                  </div>

                `
            ).join('')

          : `
              <div class="empty">
                No withdrawals yet.
              </div>
            `
      }

    </div>

  `;

}

async function withdraw(){

  if(busy) return;

  busy = true;

  try{

    await api(
      '/api/withdraw',
      {
        etb:$('#wamt').value,
        method:$('#wmeth').value,
        account:$('#wacc').value
      }
    );

    haptic();

    toast(
      'Request sent successfully.'
    );

    await loadMe();

    WDS =
      (
        await api(
          '/api/withdrawals'
        )
      ).items;

    render();

  }catch(e){

    if(
      e.code !== 'gate'
    ){

      toast(
        errMsg(e)
      );

    }

  }

  busy = false;

}

   ADMIN
========================================================= */

  ad_cooldown:

  ads_per_level:
    'Ads per day by level (JSON list)',

  referral_reward:
    'Referral reward (coins)',

  milestone_bonus:
    'Level-up bonus (coins)',

  freeze_price:
    'Streak save price (coins)',

  free_spins:
    'Free spins per day',

  spin_cost:
    'Paid spin cost (coins)',

  free_table:
    'Free spin prizes [[prize, weight], ...]',

  paid_table:
    'Paid spin prizes [[prize, weight], ...]',

  coin_per_etb:
    'Coins per 1 ETB',

  min_withdraw_etb:
    'Minimum withdrawal (ETB)',

  withdraw_referrals_required:

  withdraw_interval_hours:

  global_daily_cap_etb:

  weekly_top_inviter_min:
    'Min invites/week for top-inviter bonus',

  weekly_top_inviter_bonus_etb:

  anticheat_ip_check:
    'Flag accounts sharing an IP (true/false)'

};

function vAdmin(){

  if(!ADMIN){

    return `
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div class="loading-text">
          Loading admin panel...
        </div>
      </div>
    `;

  }

  const s =
    ADMIN.stats;

  return `

    <div class="grid2">

      <div class="card">

        <div class="muted">
          Users
        </div>

        <b
          style="font-size:22px"
        >
          ${s.users}
        </b>

        <div class="muted">
          +${s.new_today} today
        </div>

      </div>

      <div class="card">

        <div class="muted">
          Coins owed
        </div>

        <b
          style="font-size:22px"
        >
          ${fmt(s.coins_owed)}
        </b>

        <div class="muted">
          ${
            (
              s.coins_owed /
              ME.cfg.coin_per_etb
            ).toFixed(0)
          }
          ETB
        </div>

      </div>

    </div>

    <div
      class="card"
      style="margin-top:12px"
    >

      <div
        class="row between"
      >

        <b>
          Withdrawals
        </b>

        <label
          class="row"
          style="
            margin:0;
            gap:8px;
            color:var(--text)
          "
        >

          <input
            type="checkbox"
            style="
              width:auto;
              margin:0
            "
            ${
              ADMIN.settings.withdrawals_open !== false
                ? 'checked'
                : ''
            }
            onchange="
              setSetting(
                'withdrawals_open',
                this.checked
              )
            "
          >

          Open

        </label>

      </div>

      ${
        ADMIN.pending.length

          ? ADMIN.pending.map(
              (w)=>
                `

                  <div class="item">

                    <div class="grow">

                      <div class="t">
                        #${w.id}
                        ${esc(w.first_name)}
                        ·
                        ${w.etb} ETB
                      </div>

                      <div class="muted">
                        ${esc(w.method)}
                        ${esc(w.account)}
                      </div>

                    </div>

                  </div>

                `
            ).join('') +

            `
              <p
                class="muted"
                style="margin-top:8px"
              >
                Approve or reject in the bot chat.
              </p>
            `

          : `
              <p
                class="muted"
                style="margin-top:8px"
              >
                No pending withdrawals.
              </p>
            `
      }

      <p
        class="muted"
        style="margin-top:8px"
      >
        Flagged accounts:
        ${s.flagged}

        ·

        Task proofs waiting:
        ${s.pending_tasks}
      </p>

    </div>

    <h2>
      New task
    </h2>

    <div class="card">

      <label>
        Type

        <select
          id="ttype"
          onchange="taskType()"
        >

          <option value="channel">
            Join a Telegram channel
          </option>

          <option value="social">
            Social task with screenshot
          </option>

        </select>

      </label>

      <label>
        Title

        <input
          id="ttitle"
          placeholder="Subscribe to our YouTube"
        >
      </label>

      <label id="lchat">
        Channel (@username)

        <input
          id="tchat"
          placeholder="@channel"
        >
      </label>

      <label
        id="lurl"
        style="display:none"
      >
        Link

        <input
          id="turl"
          placeholder="https://..."
        >
      </label>

      <label>
        Reward (coins)

        <input
          id="trew"
          type="number"
          value="10"
        >
      </label>

      <label>
        Max users

        <input
          id="tmax"
          type="number"
          placeholder="500"
        >
      </label>

      <label
        class="row"
        style="gap:8px;margin-top:12px;color:var(--text)"
      >

        <input
          type="checkbox"
          id="tbroadcast"
          style="width:auto;margin:0"
        >
        Broadcast to all users with a
        Start button

      </label>

      <button
        class="btn"
        style="margin-top:14px"
        onclick="addTask()"
      >
        Add task
      </button>

    </div>

    <h2>
      All tasks
    </h2>

    <div class="card">

      ${
        ADMIN.tasks.length

          ? ADMIN.tasks.map(
              (t)=>
                `

                  <div class="item">

                    <div class="grow">

                      <div class="t">
                        ${esc(t.title)}
                      </div>

                      <div class="muted">
                        ${t.type}
                        ·
                        ${t.reward} coins
                        ·
                        ${t.taken}
                        ${
                          t.max_users

                            : ''
                        }
                        done
                      </div>

                    </div>

                    <button
                      class="btn ghost sm"
                      onclick="toggleTask(${t.id})"

                      ${
                        t.active

                          : 'Start'
                      }
                    </button>

                  </div>

                `
            ).join('')

          : `
              <div class="empty">
                No tasks yet.
              </div>
            `
      }

    </div>

    <h2>
      Promo codes
    </h2>

    <div class="card">

      ${
        ADMIN.promos.map(
          (p)=>
            `

              <div class="item">

                <div class="grow">

                  <b>
                    ${esc(p.code)}
                  </b>

                  <div class="muted">
                    ${p.reward} coins
                    ·
                    ${p.uses}
                    ${
                      p.max_uses
                        ? '/' + p.max_uses
                        : ''
                    }
                    used
                  </div>

                </div>

              </div>

            `
        ).join('')
      }

      <label>
        Code

        <input
          id="pcode"
          placeholder="WELCOME"
        >
      </label>

      <label>
        Reward (coins)

        <input
          id="prew"
          type="number"
          value="20"
        >
      </label>

      <label>
        Max uses

        <input
          id="pmax"
          type="number"
          placeholder="100"
        >
      </label>

      <button
        class="btn"
        style="margin-top:14px"
        onclick="addPromo()"
      >
        Save code
      </button>

    </div>

    <h2>
      Settings
    </h2>

    <div class="card">

      ${
        Object.keys(
          SET_LABELS
        ).map(
          (k)=>
            `

              <label>
                ${SET_LABELS[k]}

                <input
                  id="s_${k}"
                  value='${esc(
                    JSON.stringify(
                      ADMIN.settings[k]
                    )
                  )}'
                >
              </label>

              <button
                class="btn ghost sm"
                style="margin-top:8px"
                onclick="saveSetting('${k}')"
              >
                Save
              </button>

            `
        ).join('')
      }

    </div>

  `;

}

function taskType(){

  const c =
    $('#ttype').value === 'channel';

  $('#lchat').style.display =
    c ? '' : 'none';

  $('#lurl').style.display =
    c ? 'none' : '';

}

async function adm(
  path,
  body,
  okMsg
){

  try{

    await api(
      path,
      body || {}
    );

    toast(
      okMsg || 'Saved'
    );

    ADMIN =
      await api(
        '/api/admin/overview'
      );

    render();

  }catch(e){

    toast(
      errMsg(e)
    );

  }

}

const addTask =
  () =>
    adm(
      '/api/admin/task',
      {
        type:$('#ttype').value,
        title:$('#ttitle').value,
        chat:$('#tchat').value,
        url:$('#turl').value,
        reward:$('#trew').value,
        max_users:$('#tmax').value,
        broadcast:$('#tbroadcast').checked
      },
      'Task added'
    );

const toggleTask =
  (id) =>
    adm(
      `/api/admin/task/${id}/toggle`
    );

const addPromo =
  () =>
    adm(
      '/api/admin/promo',
      {
        code:$('#pcode').value,
        reward:$('#prew').value,
        max_uses:$('#pmax').value
      }
    );

const setSetting =
  (key,value) =>
    adm(
      '/api/admin/setting',
      {
        key,
        value
      }
    );

function saveSetting(k){

  let v;

  try{

    v =
      JSON.parse(
        $('#s_' + k).value
      );

  }catch(e){

    return toast(
      'Invalid format'
    );

  }

  return setSetting(
    k,
    v
  );

}

/* =========================================================
   START
========================================================= */

boot();

</script>
