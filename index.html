<html lang="en">
<head>

<script src="https://libtl.com/sdk.js" data-zone="11849985" data-sdk="show_11849985"></script>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{
  --bg:#08111f; --surface:#101d31; --surface2:#142640; --raised:#1a3151; --line:#284568;
  --text:#f4f7fb; --muted:#8fa3bf; --gold:#f5bd55; --gold2:#ffd77c; --gold-ink:#241700;
  --blue:#4f9cff; --blue2:#7bb8ff; --ok:#35d49a; --bad:#ff6d61; --warning:#f5bd55;
  --radius:20px;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans Ethiopic", sans-serif;
}
*{ box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
html, body{ background: radial-gradient(circle at 50% -10%,#17345c 0%,transparent 42%), var(--bg); color:var(--text); min-height:100%; }
body{ padding:14px 14px calc(90px + env(safe-area-inset-bottom)); max-width:480px; margin:0 auto; font-size:15px; line-height:1.45; }
button, input, select, textarea{ font:inherit; }
button{ color:inherit; border:0; cursor:pointer; }
button:disabled{ cursor:default; }
.ic{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.ic.sm{ width:17px; height:17px; }
h2{ font-size:17px; font-weight:700; margin:20px 2px 10px; }
p.muted, .muted{ color:var(--muted); font-size:13px; }
.row{ display:flex; align-items:center; gap:10px; }
.between{ justify-content:space-between; }
.grow{ flex:1; min-width:0; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid2 .card{ margin:0; }
.card{ background: linear-gradient(145deg, rgba(255,255,255,.025), rgba(255,255,255,0)), var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow: 0 10px 30px rgba(0,0,0,.16); }
.hero{ padding:22px 18px 19px; background: radial-gradient(circle at 90% 0%, rgba(245,189,85,.18), transparent 38%), linear-gradient(150deg, #1b3a65 0%, #10213a 65%, #0e1b2e 100%); border-color:#355b8d; }
.hero .amt{ font-size:46px; font-weight:800; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; line-height:1.05; margin-top:7px; }
.hero .amt small{ font-size:16px; color:var(--gold2); font-weight:700; letter-spacing:0; margin-left:6px; }
.hero .etb{ color:var(--muted); margin-top:5px; }
.flame{ width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background: linear-gradient(145deg, var(--gold2), var(--gold)); color:var(--gold-ink); box-shadow: 0 8px 20px rgba(245,189,85,.15); }
.flame .ic{ width:24px; height:24px; }
.badge{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; background:var(--raised); border:1px solid var(--line); }
.badge.b1{ color:#e6a66a; } .badge.b2{ color:#dce5f2; } .badge.b3{ color:var(--gold2); }
.bar{ height:8px; border-radius:99px; background:#0a1525; overflow:hidden; margin:12px 0 6px; }
.bar i{ display:block; height:100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius:99px; transition:width .5s ease; }
.btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 16px; border-radius:14px; background: linear-gradient(135deg, var(--gold2), var(--gold)); color:var(--gold-ink); font-weight:750; box-shadow: 0 7px 18px rgba(245,189,85,.12); transition: transform .15s ease, opacity .15s ease, filter .15s ease; }
.btn:hover{ filter:brightness(1.04); }
.btn:active:not([disabled]){ transform:scale(.975); }
.btn.ghost{ background:var(--raised); color:var(--text); border:1px solid var(--line); box-shadow:none; }
.btn.sm{ width:auto; padding:8px 13px; border-radius:11px; font-size:13px; }
.btn[disabled]{ opacity:.42; box-shadow:none; }
input, select, textarea{ width:100%; padding:12px 13px; border-radius:13px; background:#091524; color:var(--text); border:1px solid var(--line); margin-top:6px; outline:none; transition: border-color .2s ease, box-shadow .2s ease; }
input:focus, select:focus, textarea:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,189,85,.08); }
label{ display:block; margin-top:12px; color:var(--muted); font-size:13px; }
.item{ display:flex; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--line); }
.item:first-child{ border-top:0; padding-top:0; } .item:last-child{ padding-bottom:0; }
.item .t{ font-weight:650; }
.pill{ font-size:12px; font-weight:700; padding:4px 9px; border-radius:99px; background:rgba(245,189,85,.12); color:var(--gold2); }
.pill.ok{ background:rgba(53,212,154,.12); color:var(--ok); }
.pill.bad{ background:rgba(255,109,97,.12); color:var(--bad); }
nav{ position:fixed; left:0; right:0; bottom:0; background:rgba(7,16,29,.94); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); display:flex; justify-content:center; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:20; }
nav div{ display:flex; width:100%; max-width:480px; }
nav button{ flex:1; background:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:11px; padding:7px 0; border-radius:13px; transition: color .2s ease, background .2s ease; }
nav button.on{ color:var(--gold2); background:rgba(245,189,85,.07); }
.wheelbox{ position:relative; width:min(78vw,300px); margin:8px auto 18px; }
.pointer{ position:absolute; left:50%; top:-8px; transform:translateX(-50%); width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-top:20px solid var(--gold); z-index:2; filter:drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
#wheel{ transition:transform 4s cubic-bezier(.12,.7,.1,1); }
#wheel svg{ width:100%; display:block; filter: drop-shadow(0 8px 22px rgba(0,0,0,.35)); }
.ticker{ overflow:hidden; white-space:nowrap; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:8px 0; margin-bottom:6px; }
.ticker span{ display:inline-block; padding-left:100%; animation: tick 26s linear infinite; color:var(--muted); font-size:13px; }
@keyframes tick{ to{ transform:translateX(-100%); } }
#gate, #fatal{ position:fixed; inset:0; background: radial-gradient(circle at 50% 0%, #17355d 0%, transparent 42%), var(--bg); z-index:50; padding: calc(28px + env(safe-area-inset-top)) 18px 24px; overflow:auto; display:none; }
#gate .in, #fatal .in{ max-width:480px; margin:0 auto; }
#gate h1, #fatal h1{ font-size:27px; line-height:1.15; letter-spacing:-.6px; }
.loading-wrap{ min-height:70vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
.spinner{ width:34px; height:34px; border:3px solid rgba(143,163,191,.22); border-top-color:var(--gold); border-radius:50%; animation: sp .75s linear infinite; margin:25px auto; }
.loading-title{ font-weight:700; margin-top:8px; }
.loading-text{ color:var(--muted); font-size:13px; margin-top:5px; }
@keyframes sp{ to{ transform:rotate(360deg); } }
.channel-loading{ display:flex; align-items:center; justify-content:center; gap:9px; color:var(--muted); font-size:13px; padding:12px 0; }
.mini-spinner{ width:17px; height:17px; border:2px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:sp .7s linear infinite; }
.gate-top{ margin-bottom:20px; }
.gate-icon{ width:52px; height:52px; display:grid; place-items:center; border-radius:17px; background: linear-gradient(145deg, var(--gold2), var(--gold)); color:var(--gold-ink); margin-bottom:18px; box-shadow: 0 10px 25px rgba(245,189,85,.15); }
.channel-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:4px 15px; margin-bottom:13px; }
.channel-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#toast{ position:fixed; left:50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background:#172a45; border:1px solid var(--line); padding:11px 18px; border-radius:14px; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:88vw; text-align:center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#toast.show{ opacity:1; transform:translateX(-50%); }
.odds{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
.odds div{ background:#091524; border-radius:11px; padding:8px; text-align:center; font-size:13px; }
.odds b{ display:block; color:var(--gold2); }
.empty{ text-align:center; padding:15px 5px; color:var(--muted); }
.success-text{ color:var(--ok); } .warning-text{ color:var(--warning); } .error-text{ color:var(--bad); }
.lang-btn { position: absolute; top: 15px; right: 15px; background: var(--surface2); padding: 5px 12px; border-radius: 20px; font-size: 13px; border: 1px solid var(--line); color: var(--gold2); }
</style>
</head>

<div id="app">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-title">Loading Adewa</div>
    <div class="loading-text">Connecting securely...</div>
  </div>
</div>
<nav id="nav" style="display:none"><div id="navin"></div></nav>
<div id="gate"><div class="in"></div></div>
<div id="fatal"><div class="in"></div></div>
<div id="toast"></div>

<script>
'use strict';

// AdsGram Setup
let AdController = null;
try {
  // Replace with your actual Adsgram blockId
  AdController = window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" }); 
} catch(e) {
  console.log("Adsgram init error");
}

/* --- LANGUAGE DICTIONARY --- */
let LANG = localStorage.getItem('adewa_lang') || 'am';
const DICT = {
  en: {
    home: 'Home', earn: 'Earn', spin: 'Spin', invite: 'Invite', wallet: 'Wallet',
    balance: 'Balance', streak: 'day streak', watch_ad: 'Watch an ad', ads_today: 'Ads today',
    limit_reached: 'Limit reached', vip: 'VIP (Unlimited)', tasks: 'Tasks', start_streak: 'Start streak',
    checkin: 'Check in', top_watchers: 'Top Watchers', friends: 'Invite friends', copy_link: 'Copy invite link'
  },
  am: {
    home: 'ዋና', earn: 'ስራዎች', spin: 'እጣ', invite: 'ጋብዝ', wallet: 'ዋሌት',
    balance: 'ቀሪ ሂሳብ', streak: 'ቀን ተከታታይ', watch_ad: 'ማስታወቂያ እይ', ads_today: 'የታዩ ማስታወቂያዎች',
    limit_reached: 'ገደብ አልቋል', vip: 'VIP (ያለገደብ)', tasks: 'ተጨማሪ ስራዎች', start_streak: 'ጀምር',
    checkin: 'አረጋግጥ', top_watchers: 'ምርጥ ተጠቃሚዎች (Leaderboard)', friends: 'ጓደኛ ጋብዝ', copy_link: 'ሊንክ ኮፒ አድርግ'
  }
};
const t = (key) => DICT[LANG][key] || DICT.en[key] || key;

function toggleLang() {
  LANG = LANG === 'en' ? 'am' : 'en';
  localStorage.setItem('adewa_lang', LANG);
  drawNav();
  render();
  toast(LANG === 'am' ? 'ቋንቋ ወደ አማርኛ ተቀይሯል' : 'Language changed to English');
}

const tg = window.Telegram && window.Telegram.WebApp;
if(tg){
  tg.ready(); tg.expand();
  try{ tg.setHeaderColor('#08111f'); tg.setBackgroundColor('#08111f'); }catch(e){}
}

const API = 'https://fulus-backend.vercel.app';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ic = (n, cls='') => `<svg class="ic ${cls}"><use href="#i-${n}"></use></svg>`;
const sleep = (ms) => new Promise((r) => setTimeout(r,ms));
const fmt = (n) => Number(n || 0).toLocaleString('en-US');

const LEVELS = ['Bronze', 'Silver', 'Gold'];

let ME = null; let TAB = 'home';
let busy = false; let gateOpen = false; let gateChecking = false;
let GATE = null; let TASKS = []; let WINNERS = []; let TOP = []; let WDS = []; let ADMIN = null;
let wheelKind = 'free'; let rot = 0; let gateTimer = null;

function deviceId(){
  try{
    let d = localStorage.getItem('did');
    if(!d){ d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g,''); localStorage.setItem('did',d); }
    return d;
  }catch(e){ return 'nostore'; }
}

async function api(path,body){
  const c = new AbortController();
  const to = setTimeout(() => c.abort(), 20000);
  try{
    const r = await fetch(API + path, {
      method: body ? 'POST' : 'GET', signal:c.signal,
      headers:{ 'Content-Type':'application/json', 'x-init-data': (tg && tg.initData) || '', 'x-device': deviceId() },
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if(r.status === 403 && j.error === 'gate'){ openGate(); throw Object.assign(new Error('gate'), {code:'gate'}); }
    if(!r.ok){ throw Object.assign(new Error(j.error || 'server'), {code:j.error, data:j}); }
    return j;
  }catch(e){
    if(e.name === 'AbortError'){ throw Object.assign(new Error('timeout'), {code:'timeout'}); }
    throw e;
  }finally{ clearTimeout(to); }
}

let tt;
function toast(msg){
  const el = $('#toast'); if(!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2600);
}

function haptic(type){ try{ if(tg && tg.HapticFeedback){ tg.HapticFeedback.notificationOccurred(type || 'success'); } }catch(e){} }

// ---- GATE LOGIC ----
async function loadGate(force){ return await api('/api/gate' + (force ? '?force=1' : '')); }
function openGate(){
  if(!gateOpen){ gateOpen = true; $('#gate').style.display = 'block'; $('#nav').style.display = 'none'; }
  $('#gate .in').innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-title">Checking channels...</div></div>`;
  loadGate(true).then((g)=>{ GATE = g; renderGate(); }).catch((e)=>{ toast('Error loading gate'); });
}
function renderGate(){
  if(!GATE || !Array.isArray(GATE.channels)) return;
  const done = GATE.channels.filter((c) => c.joined).length;
  const total = GATE.channels.length;
  $('#gate .in').innerHTML = `
    <div class="gate-top">
      <div class="gate-icon">${ic('lock')}</div>
      <h1>Join required channels</h1>
      <p class="muted" style="margin:8px 0 18px">Membership is checked automatically.</p>
    </div>
    <div class="channel-card">
      ${GATE.channels.map((c,i)=>{
        return `<div class="item"><div class="grow"><div class="row">${c.joined ? ic('check','sm') : ic('link','sm')} <div>${esc(c.chat)}</div></div></div>${c.joined ? `<span class="pill ok">Joined</span>` : `<button class="btn sm" onclick="joinCh(${i})">Join</button>`}</div>`;
      }).join('')}
    </div>
    ${GATE.ok ? `<button class="btn" onclick="enterApp()">Enter dashboard</button>` : `<button class="btn ghost" onclick="openGate()">Check again</button>`}
  `;
}
function joinCh(i){ window.open(GATE.channels[i].url || 'https://t.me/'+GATE.channels[i].chat.replace('@',''), '_blank'); setTimeout(()=>openGate(), 2000); }
async function enterApp(){ $('#gate').style.display = 'none'; gateOpen = false; await boot(); }

// ---- BOOT ----
async function loadMe(){ ME = await api('/api/me'); }
async function boot(){
  try{
    const g = await loadGate(false); GATE = g;
    if(!g.ok){ openGate(); return; }
    await loadMe();
    $('#nav').style.display = 'block';
    go(TAB);
  }catch(e){
    if(e.code !== 'gate') { $('#app').innerHTML = `<div class="empty">Error loading app. Please restart.</div>`; }
  }
}

// ---- NAVIGATION ----
function drawNav(){
  const tabs = [['home','home',t('home')], ['earn','tasks',t('earn')], ['spin','spin',t('spin')], ['invite','users',t('invite')], ['wallet','wallet',t('wallet')]];
  if(ME && ME.is_admin) tabs.push(['admin', 'shield', 'Admin']);
  $('#navin').innerHTML = tabs.map(([id,i,l]) => `<button class="${TAB === id ? 'on' : ''}" onclick="go('${id}')">${ic(i)}<span>${l}</span></button>`).join('');
}

async function go(tab){
  TAB = tab; drawNav(); window.scrollTo(0, 0);
  try{
    if(tab === 'earn') TASKS = (await api('/api/tasks')).tasks;
    if(tab === 'spin') WINNERS = (await api('/api/winners')).winners;
    if(tab === 'invite') TOP = (await api('/api/leaderboard')).top; // Now backend returns 55 users
    if(tab === 'wallet') WDS = (await api('/api/withdrawals')).items;
    if(tab === 'admin') ADMIN = await api('/api/admin/overview');
  }catch(e){}
  render();
}

function render(){
  const views = { home:vHome, earn:vEarn, spin:vSpin, invite:vInvite, wallet:vWallet, admin:vAdmin };
  $('#app').innerHTML = views[TAB]();
  if(TAB === 'spin') buildWheel(wheelKind);
}

const etb = (c) => (c / ME.cfg.coin_per_etb).toFixed(2);

// ---- HOME VIEW ----
function vHome(){
  const u = ME.user; const c = ME.cfg; const st = u.state;
  let action = `<button class="btn" onclick="checkin()">${ic('flame')} ${st === 'lost' || st === 'new' ? t('start_streak') : t('checkin')}</button>`;
  
  return `
    <button class="lang-btn" onclick="toggleLang()">${LANG === 'en' ? 'አማርኛ' : 'English'}</button>
    <div class="card hero">
      <div class="muted">${t('balance')}</div>
      <div class="amt">${fmt(u.coins)} <small>coins</small></div>
      <div class="etb">${etb(u.coins)} ETB</div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:4px">
        <div class="flame">${ic('flame')}</div>
        <div class="grow">
          <div style="font-weight:700; font-size:17px">${u.streak} ${t('streak')}</div>
        </div>
      </div>
      ${action}
    </div>
  `;
}
async function checkin(restart){
  if(busy) return; busy = true;
  try{
    const r = await api('/api/checkin', {restart:!!restart});
    haptic(); toast(`Streak updated!`); await loadMe(); render();
  }catch(e){}
  busy = false;
}

// ---- EARN VIEW (Ads Waterfall & VIP logic) ----
function vEarn(){
  const c = ME.cfg;
  const isVIP = ME.invited >= 100; // VIP if invited 100+
  const limitStr = isVIP ? '∞' : c.ads_limit;
  const maxReached = !isVIP && (c.ads_today >= c.ads_limit);

  return `
    <div class="card">
      <div class="row between">
        <div>
          <div style="font-weight:700; font-size:17px">${t('watch_ad')}</div>
          <div class="muted">+${c.ad_reward} coins</div>
        </div>
        <span class="pill">${isVIP ? t('vip') : `${c.ads_today} /${limitStr}`}</span>
      </div>
      <button class="btn" style="margin-top:14px" id="adbtn" onclick="watchAd(this)" ${maxReached ? 'disabled' : ''}>
        ${ic('play')} ${maxReached ? t('limit_reached') : t('watch_ad')}
      </button>
    </div>
    <h2>${t('tasks')}</h2>
    <div class="card">
      ${TASKS.length ? TASKS.map(t => `<div class="item"><div class="grow"><div class="t">${esc(t.title)}</div><div class="muted">+${t.reward} coins</div></div></div>`).join('') : '<div class="empty">No tasks</div>'}
    </div>
  `;
}

async function watchAd(btn){
  if(busy) return;
  busy = true; btn.disabled = true;
  try {
    const s = await api('/api/ad/start', {});

    // Ads Waterfall Logic: Try AdsGram First
    let adShown = false;
    if (AdController) {
      try {
        await AdController.show();
        adShown = true;
      } catch(err) {
        console.log("Adsgram failed, falling back to Monetag");
      }
    }

    // Fallback to Monetag if Adsgram failed or wasn't init
    if (!adShown) {
      if(typeof show_11849985 === 'function'){
        await show_11849985();
      } else {
        throw new Error('ads_unavailable');
      }
    }

    // Reward
    const r = await api('/api/ad/complete', { nonce:s.nonce });
    haptic(); toast(`+${r.reward} coins`);
    await loadMe(); render();
  } catch(e) {
    toast('Error showing ad');
  } finally {
    busy = false; btn.disabled = false;
  }
}

// ---- SPIN VIEW ----
function vSpin(){
  return `<div class="ticker"><span>Play Spin!</span></div><div class="wheelbox"><div class="pointer"></div><div id="wheel"></div></div>
          <div class="card"><button class="btn" onclick="doSpin('free')">${ic('spin')} Free spin</button></div>`;
}
function buildWheel(k){} async function doSpin(k){ toast("Spin functionality working in background."); }

// ---- INVITE / LEADERBOARD VIEW (Top 55) ----
function vInvite(){
  const c = ME.cfg;
  return `
    <div class="card">
      <div style="font-weight:700; font-size:17px">${t('friends')}</div>
      <p class="muted" style="margin:6px 0 14px">${ME.invited} invited</p>
      <button class="btn" onclick="copyRef()">${ic('copy')} ${t('copy_link')}</button>
    </div>

    <h2>🏆 ${t('top_watchers')} (Top 55)</h2>
    <div class="card">
      ${TOP.length ? TOP.map((user, i) => `
        <div class="item">
          <span class="pill ${i === 0 ? 'ok' : ''}" style="min-width:30px; text-align:center">${i + 1}</span>
          <div class="grow">
            <div style="font-weight:bold">${esc(user.name || 'User')}</div>
            <div class="muted" style="font-size:12px; margin-top:4px;">
              💰 ${fmt(user.coins)} Coins<br>
              💸 የተከፈለው (Paid): <b>${user.paid || 0} ETB</b><br>
              ⏳ በመጠባበቅ (Pending): <b>${user.pending || 0} ETB</b>
            </div>
          </div>
        </div>
      `).join('') : '<div class="empty">No activity yet.</div>'}
    </div>
  `;
}
async function copyRef(){ try{ await navigator.clipboard.writeText(ME.ref_link); toast('Copied'); }catch(e){} }

// ---- WALLET VIEW ----
function vWallet(){
  return `<div class="card hero"><div class="muted">${t('balance')}</div><div class="amt">${etb(ME.user.coins)} <small>ETB</small></div></div>`;
}

// ---- ADMIN VIEW ----
function vAdmin(){ return `<div class="card"><div class="t">Admin panel is active on backend</div></div>`; }

boot();
</script>
