<style>
:root{
  --bg:#05090f;
  --surface:#101a2c;
  --surface2:#152238;
  --raised:#1c2d47;
  --line:rgba(148,180,222,.16);
  --text:#f5f8fc;
  --muted:#8ea0bc;
  --gold:#16c777;
  --gold2:#4bffa0;
  --gold-ink:#04150b;
  --blue:#4f9cff;
  --blue2:#7bb8ff;
  --ok:#35d49a;
  --bad:#ff6d61;
  --warning:#f5bd55;
  --radius:22px;
  --glass:rgba(255,255,255,.045);
  font-family:"Inter","Noto Sans Ethiopic",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
html,body{
  background:radial-gradient(circle at 15% -8%,rgba(75,255,160,.14) 0%,transparent 40%),
             radial-gradient(circle at 85% 0%,rgba(22,199,119,.12) 0%,transparent 42%),
             radial-gradient(circle at 50% 105%,rgba(75,255,160,.06) 0%,transparent 45%),var(--bg);
  background-attachment:fixed;color:var(--text);min-height:100%;letter-spacing:-.1px;
}
body{padding:14px 14px calc(104px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;font-size:15px;line-height:1.45;}
button,input,select,textarea{font:inherit;}
button{color:inherit;border:0;cursor:pointer;}
button:disabled{cursor:default;}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.ic.sm{width:17px;height:17px;}
h2{font-size:17px;font-weight:700;margin:20px 2px 10px;}
p.muted,.muted{color:var(--muted);font-size:13px;}
.row{display:flex;align-items:center;gap:10px;}
.between{justify-content:space-between;}
.grow{flex:1;min-width:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid2 .card{margin:0;}

@keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,0) 60%),var(--glass),var(--surface);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
  animation:cardIn .35s cubic-bezier(.2,.8,.2,1) both;
}
.hero{
  padding:22px 18px 19px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 88% -10%,rgba(75,255,160,.22),transparent 42%),
             radial-gradient(circle at 0% 110%,rgba(22,199,119,.14),transparent 45%),
             linear-gradient(150deg,#16301f 0%,#0e1a13 60%,#0a120d 100%);
  border-color:rgba(75,255,160,.28);
}
.hero .amt{font-size:46px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:7px;}
.hero .amt small{font-size:16px;color:var(--gold2);font-weight:700;letter-spacing:0;margin-left:6px;}
.hero .etb{color:var(--muted);margin-top:5px;}
.flame{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--gold-ink);
  box-shadow:0 8px 20px rgba(245,189,85,.15);
}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--raised);border:1px solid var(--line);}
.badge.b1{color:#e6a66a;}
.badge.b2{color:#dce5f2;}
.badge.b3{color:var(--gold2);}
.bar{height:8px;border-radius:99px;background:#0a1525;overflow:hidden;margin:12px 0 6px;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .5s ease;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;
  border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--gold-ink);
  font-weight:750;box-shadow:0 10px 24px rgba(245,189,85,.22),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s ease,opacity .15s ease,filter .15s ease,box-shadow .15s ease;
}
.btn:hover{filter:brightness(1.06);box-shadow:0 12px 28px rgba(245,189,85,.3),inset 0 1px 0 rgba(255,255,255,.35);}
.btn:active:not([disabled]){transform:scale(.97);}
.btn.ghost{background:var(--raised);color:var(--text);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
.btn.sm{width:auto;padding:9px 14px;border-radius:12px;font-size:13px;}
.btn[disabled]{opacity:.4;box-shadow:none;filter:grayscale(.3);}
input,select,textarea{
  width:100%;padding:12px 13px;border-radius:13px;background:#091524;color:var(--text);
  border:1px solid var(--line);margin-top:6px;outline:none;transition:border-color .2s ease,box-shadow .2s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,189,85,.08);}
label{display:block;margin-top:12px;color:var(--muted);font-size:13px;}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);}
.item:first-child{border-top:0;padding-top:0;}
.item:last-child{padding-bottom:0;}
.item .t{font-weight:650;}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(245,189,85,.12);color:var(--gold2);}
.pill.ok{background:rgba(53,212,154,.12);color:var(--ok);}
.pill.bad{background:rgba(255,109,97,.12);color:var(--bad);}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(14px + env(safe-area-inset-bottom));z-index:20;pointer-events:none;}
nav div{
  display:flex;width:100%;max-width:480px;pointer-events:auto;background:rgba(14,22,38,.82);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px;
  padding:6px;box-shadow:0 16px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.06);
}
nav button{
  flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);
  font-size:11px;padding:8px 0;border-radius:14px;transition:color .2s ease,background .2s ease,transform .15s ease;
}
nav button.on{color:var(--gold-ink);background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 6px 16px rgba(245,189,85,.28);}
nav button:active{transform:scale(.94);}
.navemoji{font-size:20px;line-height:1;}

.wheelbox{position:relative;width:min(78vw,300px);margin:8px auto 18px;}
.pointer{
  position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--gold);
  z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));
}
#wheel{transition:transform 4s cubic-bezier(.12,.7,.1,1);}
#wheel svg{width:100%;display:block;filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));}
.ticker{overflow:hidden;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:8px 0;margin-bottom:6px;}
.ticker span{display:inline-block;padding-left:100%;animation:tick 26s linear infinite;color:var(--muted);font-size:13px;}
@keyframes tick{to{transform:translateX(-100%);}}

#gate,#fatal{
  position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(75,255,160,.12) 0%,transparent 42%),
                                   radial-gradient(circle at 100% 100%,rgba(22,199,119,.1) 0%,transparent 45%),var(--bg);
  z-index:50;padding:calc(28px + env(safe-area-inset-top)) 18px 24px;overflow:auto;display:none;
}
#gate .in,#fatal .in{max-width:480px;margin:0 auto;}
#gate h1,#fatal h1{font-size:27px;line-height:1.15;letter-spacing:-.6px;}
.loading-wrap{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.boot-logo{
  width:96px;height:96px;display:grid;place-items:center;border-radius:26px;
  background:linear-gradient(150deg,#4bffa0,#16c777);font-size:44px;font-weight:800;color:#05130b;
  box-shadow:0 0 0 1px rgba(76,255,160,.25),0 0 60px 14px rgba(46,224,132,.35);margin-bottom:18px;
}
.spinner{width:34px;height:34px;border:3px solid rgba(46,224,132,.18);border-top-color:#2ee084;border-radius:50%;animation:sp .75s linear infinite;margin:25px auto;}
.loading-title{font-weight:800;font-size:19px;margin-top:8px;}
.loading-text{color:var(--muted);font-size:13px;margin-top:5px;}
@keyframes sp{to{transform:rotate(360deg);}}
.gate-icon{
  width:52px;height:52px;display:grid;place-items:center;border-radius:17px;
  background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--gold-ink);margin-bottom:18px;
}
.channel-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 15px;margin-bottom:13px;}
#toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#172a45;border:1px solid var(--line);padding:11px 18px;border-radius:14px;opacity:0;
  pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%);}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.odds div{background:#091524;border-radius:11px;padding:8px;text-align:center;font-size:13px;}
.odds b{display:block;color:var(--gold2);}
.warning-text{color:var(--warning);}
.error-text{color:var(--bad);}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></symbol>

  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>

<div id="app">
  <div class="loading-wrap">
    <div class="boot-logo">A</div>
    <div class="loading-title">Adewa</div>
    <div class="loading-text">Loading your portal...</div>
    <div class="spinner"></div>
  </div>
</div>

<nav id="nav" style="display:none"><div id="navin"></div></nav>
<div id="gate"><div class="in"></div></div>
<div id="fatal"><div class="in"></div></div>
<div id="toast"></div>

<script>
'use strict';

const tg = window.Telegram && window.Telegram.WebApp;
if(tg){
  tg.ready();
  tg.expand();
  try{
    tg.setHeaderColor('#05090f');
    tg.setBackgroundColor('#05090f');
  }catch(e){}
}

const API = 'https://fulus-backend.vercel.app';
const ADSGRAM_BLOCK_ID = '49234';
const adsgram = (window.Adsgram && ADSGRAM_BLOCK_ID !== 'YOUR_ADSGRAM_BLOCK_ID')
  ? window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID })
  : null;

let buttonAdsShown = 0;
async function showInterstitialAd(){
  if(buttonAdsShown >= 3) return;
  buttonAdsShown++;
  try{
    if(typeof show_11849985 === 'function'){
      await show_11849985();
      return;
    }
  }catch(e){}
  try{
    if(adsgram){
      await adsgram.show();
      return;
    }
  }catch(e){}
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls='') => `<svg class="ic ${cls}"><use href="#i-${n}"></use></svg>`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const LEVELS = ['Bronze', 'Silver', 'Gold'];

let ME = null;
let TAB = 'home';
let busy = false;
let gateOpen = false;
let gateChecking = false;
let GATE = null;
let TASKS = [];
let WINNERS = [];
let TOP = [];
let INVITERS = [];
let WDS = [];
let ADMIN = null;
let wheelKind = 'free';
let gateTimer = null;

function deviceId(){
  try{
    let d = localStorage.getItem('did');
    if(!d){
      d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g,'');
      localStorage.setItem('did', d);
    }
    return d;
  }catch(e){
    return 'nostore';
  }
}

const ERR = {
  timeout: 'Server timeout. Try again.',
  bad_auth: 'Open app from Telegram bot.',
  quota: 'You reached today\'s ad limit.',
  no_spins: 'No free spins left today.',
  no_coins: 'Not enough coins.',
  closed: 'Withdrawals are closed right now.',
  interval: 'Withdrawal cooldown active.',
  under_review: 'Your account is under review.',
  bad_input: 'Check the details and try again.',
  bad_ton_address: 'Enter a valid TON Address (UQ... or EQ...).',
  min: 'Amount is below the minimum.',
  already: 'Already done.',
  server: 'Something went wrong.'
};

function errMsg(e){
  return (ERR[e && e.code] || ERR[e && e.message] || (e && e.message) || ERR.server);
}

async function api(path, body){
  const c = new AbortController();
  const to = setTimeout(() => c.abort(), 20000);
  try{
    const r = await fetch(API + path, {
      method: body ? 'POST' : 'GET',
      signal: c.signal,
      headers: {
        'Content-Type': 'application/json',
        'x-init-data': (tg && tg.initData) || '',
        'x-device': deviceId()
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if(r.status === 403 && j.error === 'gate'){
      openGate();
      throw Object.assign(new Error('gate'), {code:'gate'});
    }
    if(!r.ok){
      throw Object.assign(new Error(j.error || 'server'), {code: j.error, data: j});
    }
    return j;
  }finally{
    clearTimeout(to);
  }
}

let tt;
function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(() => t.classList.remove('show'), 2600);
}

function fatal(msg){
  $('#fatal .in').innerHTML = `
    <div class="gate-icon">${ic('shield')}</div>
    <h1>Can't load app</h1>
    <p class="muted" style="margin:10px 0 20px">${esc(msg)}</p>
    <button class="btn" onclick="location.reload()">${ic('refresh')} Try again</button>
  `;
  $('#fatal').style.display = 'block';
}

function haptic(type='success'){
  try{ if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type); }catch(e){}
}

function openGate(){
  if(!gateOpen){
    gateOpen = true;
    $('#gate').style.display = 'block';
    $('#nav').style.display = 'none';
  }
  api('/api/gate?force=1')
    .then((g)=>{ GATE = g; renderGate(); })
    .catch((e)=>{ toast(errMsg(e)); });
}

function renderGate(){
  if(!GATE || !Array.isArray(GATE.channels)) return;
  const done = GATE.channels.filter((c) => c.joined).length;
  const total = GATE.channels.length;
  const percent = total ? Math.round((done / total) * 100) : 100;

  $('#gate .in').innerHTML = `
    <div class="gate-top">
      <div class="gate-icon">${ic('lock')}</div>
      <h1>Join required channels</h1>
      <p class="muted" style="margin:8px 0 18px">Join all channels to unlock the app.</p>
      <div class="bar"><i style="width:${percent}%"></i></div>
    </div>
    <div class="channel-card">
      ${GATE.channels.map((c, i) => `
        <div class="item">
          <div class="grow">
            <div class="t">${esc(c.chat)}</div>
            <div class="muted">${c.joined ? 'Joined' : 'Membership required'}</div>
          </div>
          ${c.joined
            ? `<span class="pill ok row">${ic('check','sm')} Done</span>`
            : `<button class="btn sm" onclick="joinCh(${i})">${ic('link','sm')} Join</button>`}
        </div>
      `).join('')}
    </div>
    ${GATE.ok ? `<button class="btn" onclick="enterApp()">${ic('home')} Enter app</button>` : ''}
  `;
}

function joinCh(i){
  const c = GATE.channels[i];
  const url = c.url || ('https://t.me/' + c.chat.replace('@',''));
  if(tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url, '_blank');
}

async function enterApp(){
  $('#gate').style.display = 'none';
  gateOpen = false;
  await boot();
}

async function boot(){
  if(!tg || !tg.initData){
    fatal('Open this app from the Telegram bot.');
    return;
  }
  try{
    const g = await api('/api/gate');
    GATE = g;
    if(!g.ok){ openGate(); return; }
    ME = await api('/api/me');
    $('#nav').style.display = 'block';
    go(TAB);
  }catch(e){
    if(e.code !== 'gate') fatal(errMsg(e));
  }
}

function drawNav(){
  const tabs = [
    ['home','home','Home'],
    ['earn','tasks','Earn'],
    ['spin','spin','Spin'],
    ['invite','users','Invite'],
    ['wallet','wallet','Wallet']
  ];
  if(ME && ME.is_admin) tabs.push(['admin','shield','Admin']);

  $('#navin').innerHTML = tabs.map(([id, i, l]) => `
    <button class="${TAB === id ? 'on' : ''}" onclick="go('${id}')">
      <span class="navemoji">${i==='home'?'🏠':i==='tasks'?'📺':i==='spin'?'🎡':i==='users'?'👥':i==='wallet'?'💎':'🛠️'}</span>
      <span>${l}</span>
    </button>
  `).join('');
}

async function go(tab){
  TAB = tab;
  drawNav();
  window.scrollTo(0,0);
  try{
    if(tab === 'earn') TASKS = (await api('/api/tasks')).tasks;
    if(tab === 'spin') WINNERS = (await api('/api/winners')).winners;
    if(tab === 'invite'){
      const lb = await api('/api/leaderboard');
      TOP = lb.top; INVITERS = lb.inviters;
    }
    if(tab === 'wallet') WDS = (await api('/api/withdrawals')).items;
    if(tab === 'admin') ADMIN = await api('/api/admin/overview');
  }catch(e){
    if(e.code !== 'gate') toast(errMsg(e));
  }
  render();
}

function render(){
  const views = { home:vHome, earn:vEarn, spin:vSpin, invite:vInvite, wallet:vWallet, admin:vAdmin };
  $('#app').innerHTML = views[TAB]();
  if(TAB === 'spin') buildWheel(wheelKind);
}

async function watchAd(btn){

  btn.disabled = true;
  try{

    if(adsgram) await adsgram.show();
    else if(typeof show_11849985 === 'function') await show_11849985();

/* =========================================================  
   SPIN  
========================================================= */  
function vSpin(){
  const s = ME.cfg.spin;
  return `
    <div class="wheelbox">
      <div class="pointer"></div>
      <div id="wheel"></div>
    </div>
    <div class="card">
      <button class="btn" id="fbtn" onclick="showInterstitialAd();doSpin('free')" ${s.free_left ? '' : 'disabled'}>
        ${ic('spin')} Free spin (${s.free_left} left)
      </button>
      <button class="btn ghost" style="margin-top:10px" id="pbtn" onclick="showInterstitialAd();doSpin('paid')" ${ME.user.coins >= s.cost ? '' : 'disabled'}>
        ${ic('spin')} Spin for ${s.cost} coins
      </button>
    </div>
  `;
}

function buildWheel(){
  const arr = [0, 5, 10, 20, 0, 5, 10, 50];
  const R = 96;
  const pt = (a) => [100 + R * Math.sin(a), 100 - R * Math.cos(a)];
  let svg = `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="99" fill="#08111f" stroke="#16c777" stroke-width="2"/>`;
  arr.forEach((p, i) => {
    const a1 = (i * 45) * Math.PI / 180;
    const a2 = ((i + 1) * 45) * Math.PI / 180;
    const [x1, y1] = pt(a1);
    const [x2, y2] = pt(a2);
    svg += `
      <path d="M100,100 L${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2} Z" fill="${i % 2 ? '#254a78' : '#3a2a12'}" stroke="#08111f" stroke-width="1"/>
      <text x="100" y="34" transform="rotate(${i * 45 + 22.5} 100 100)" text-anchor="middle" font-size="14" font-weight="700" fill="#4bffa0">${p}</text>
    `;
  });
  svg += `<circle cx="100" cy="100" r="10" fill="#16c777"/></svg>`;
  $('#wheel').innerHTML = svg;
}

async function doSpin(kind){
  if(busy) return;
  busy = true;
  $('#fbtn').disabled = true;
  $('#pbtn').disabled = true;
  try{
    const r = await api('/api/spin', { kind });
    $('#wheel').style.transform = `rotate(${360 * 5 + Math.floor(Math.random() * 360)}deg)`;
    await sleep(4200);
    haptic();
    toast(r.prize > 0 ? `You won ${r.prize} coins!` : 'No prize this time');
    ME = await api('/api/me');
    render();
  }catch(e){
    if(e.code !== 'gate') toast(errMsg(e));
  }
  busy = false;
}

/* =========================================================  
   WALLET (TONKEEPER ONLY + 50% SERVICE FEE)  
========================================================= */  
function vWallet(){
  const w = ME.cfg.withdraw;
  const u = ME.user;
  const balanceUsd = (u.coins / ME.cfg.coin_per_etb).toFixed(2);

  return `
    <div class="card hero">
      <div class="muted">Available Balance</div>
      <div class="amt">${balanceUsd}<small>$</small></div>
      <div class="etb">${fmt(u.coins)} coins · 100 coins = 1$</div>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:17px">Withdraw TON</div>
      <p class="muted" style="margin:6px 0 4px">
        $${w.min_etb} minimum · 50% Platform fee applies.
      </p>

      <label>
        Amount ($)
        <input id="wamt" type="number" inputmode="decimal"
          min="${w.min_etb}" step="0.1" placeholder="Minimum: ${w.min_etb}$" oninput="calcTonPayout()">
      </label>

      <label>
        Payment method
        <select id="wmeth" disabled>
          <option value="tonkeeper">Tonkeeper (TON)</option>
        </select>
      </label>

      <label>
        TON Wallet Address (Tonkeeper)
        <input id="wacc" placeholder="UQ... or EQ...">
      </label>

      <div style="background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px">
        <div class="row between muted" style="font-size:13px">
          <span>Platform Fee (50%):</span>
          <b id="wfee">0.00 $</b>
        </div>
        <div class="row between" style="margin-top:6px;font-size:14px;color:var(--gold2)">
          <span>You Receive:</span>
          <b id="wfinal">0.00 $</b>
        </div>
      </div>

      <button class="btn" style="margin-top:16px" onclick="showInterstitialAd();withdraw()">
        ${ic('send')} Request TON Withdrawal
      </button>
    </div>

    <h2>History</h2>
    <div class="card">
      ${WDS.length ? WDS.map(x => `
        <div class="item">
          <div class="grow">
            <div class="t">${x.etb}$ · TON</div>
            <div class="muted">
              ${esc((x.account \vert{}\vert{} '').slice(0, 10))}... ·${new Date(x.created_at).toLocaleDateString()}
            </div>
          </div>
          <span class="pill ${x.status === 'paid' ? 'ok' : x.status === 'rejected' ? 'bad' : ''}">
            ${x.status === 'paid' ? 'Paid' : x.status === 'rejected' ? 'Rejected' : 'Pending'}
          </span>
        </div>
      `).join('') : '<div class="empty">No withdrawals yet.</div>'}
    </div>
  `;
}

function calcTonPayout(){
  const val = Number($('#wamt').value || 0);
  const fee = (val * 0.5).toFixed(2);
  const final = (val - fee).toFixed(2);
  $('#wfee').textContent = `${fee} $`;
  $('#wfinal').textContent = `${final} $`;
}

async function withdraw(){
  if(busy) return;
  const amt = Number($('#wamt').value);
  const acc = $('#wacc').value.trim();

  if(!amt || amt <= 0) return toast('Enter a valid amount');
  if(!/^(EQ|UQ)[a-zA-Z0-9_-]{46}$/.test(acc)){
    return toast('Invalid TON address (must start with EQ or UQ)');
  }

  busy = true;
  try{
    await api('/api/withdraw', { etb: amt, account: acc, method: 'tonkeeper' });
    haptic();
    toast('Withdrawal requested!');
    ME = await api('/api/me');
    WDS = (await api('/api/withdrawals')).items;
    render();
  }catch(e){
    if(e.code !== 'gate') toast(errMsg(e));
  }
  busy = false;
}

   ADMIN  
========================================================= */  
function vAdmin(){
  if(!ADMIN) return '<div class="loading-wrap"><div class="spinner"></div></div>';
  return `
    <div class="card">

      ${ADMIN.pending.length ? ADMIN.pending.map(w => `

            <div class="t">#${w.id} ·${w.etb}$to${esc(w.account.slice(0,10))}...</div>
            <div class="muted">${esc(w.first_name)}</div>
          </div>
        </div>
      `).join('') : '<p class="muted" style="margin-top:8px">No pending withdrawals.</p>'}
    </div>
  `;
}
